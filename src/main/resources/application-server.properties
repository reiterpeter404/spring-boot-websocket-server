spring.application.name=websocket-server
server.port=8888

websocket.authentication.basic.enable_login_with_credentials=${enableLoginWithCredentials}
websocket.authentication.basic.username=${username}
websocket.authentication.basic.password=${password}

websocket.authentication.token.enable_login_with_token=${enableLoginWithToken}
websocket.authentication.token.jwtSecret=${jwtSecret}